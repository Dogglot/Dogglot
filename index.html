<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aprender Idiomas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ec;--tx:#1e1b2e;--mut:#7a7388;--card:#ffffff;--line:#ebe3d2;--g:#2fb86e;--gd:#1f8a4c;--ok:#dcf7e6;--okt:#1f8a4c;--bad:#ffe1dc;--badt:#c8402a;--blue:#2b7de9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1a1726;--tx:#f4f1ff;--mut:#a59fb8;--card:#24203a;--line:#3a3354;--ok:#183a29;--okt:#7fe0a8;--bad:#3e1f1c;--badt:#ff9a85}}
:root[data-theme="dark"]{--bg:#1a1726;--tx:#f4f1ff;--mut:#a59fb8;--card:#24203a;--line:#3a3354;--ok:#183a29;--okt:#7fe0a8;--bad:#3e1f1c;--badt:#ff9a85}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:14px;font-weight:800;background:var(--card);border:2px solid var(--line)}
.tab.on{background:var(--g);border-color:var(--gd);color:#fff}
.stats{margin-left:auto;display:flex;gap:12px;font-weight:900}
.modes{display:flex;gap:8px;width:100%;flex-wrap:wrap}
main{max-width:520px;margin:0 auto;padding:8px 16px 48px}
.unit{display:block;width:100%;text-align:left;margin:26px 0 6px;padding:14px 16px;border-radius:18px;background:var(--card);border:2px solid var(--line)}
.unit h2{margin:0;font-size:18px;font-weight:900}
.unit p{margin:4px 0 0;color:var(--mut);font-weight:700;font-size:14px}
.unit.lock{opacity:.5;cursor:not-allowed}
.path{display:flex;flex-direction:column;align-items:center;gap:16px;padding:12px 0}
.node{width:70px;height:70px;border-radius:50%;background:var(--g);color:#fff;font-weight:900;font-size:21px;box-shadow:0 7px 0 var(--gd)}
.node.done{background:#ffb800;box-shadow:0 7px 0 #d89a00}
.node.lock{background:var(--line);box-shadow:0 7px 0 #cfc5b0;color:var(--mut);cursor:not-allowed}
.node:not(.lock):active{transform:translateY(5px)!important;box-shadow:0 2px 0 var(--gd)}
#lesson{max-width:520px;min-height:calc(100vh - 40px);margin:0 auto;padding:16px;display:flex;flex-direction:column}
.center{text-align:center;justify-content:center;align-items:center}
.top{display:flex;align-items:center;gap:14px}
.x{font-size:24px;color:var(--mut);font-weight:900;padding:4px 6px}
.bar{flex:1;height:16px;border-radius:10px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:10px;transition:width .35s ease}
.q{margin:26px 0 6px;font-size:24px;font-weight:900;line-height:1.3;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spk{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;font-size:20px;box-shadow:0 4px 0 #1f5fb8;flex:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.opt{padding:16px 12px;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;background:var(--card);font-weight:800;font-size:16px;color:var(--tx)}
.opt.sel{border-color:var(--blue);background:#e4f0ff;color:#1e1b2e}
.txt{margin-top:22px;width:100%;padding:16px;font-size:20px;font-weight:800;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;background:var(--card);color:var(--tx)}
.txt:focus{outline:none;border-color:var(--blue)}
.foot{margin:auto -16px 0;padding:18px 16px 22px;border-top:2px solid var(--line)}
.foot.ok{background:var(--ok)}
.foot.bad{background:var(--bad)}
.fb{font-weight:900;font-size:17px;margin-bottom:12px}
.go{display:block;width:100%;max-width:520px;margin:0 auto;padding:16px;border-radius:16px;background:var(--g);color:#fff;font-weight:900;font-size:17px;box-shadow:0 6px 0 var(--gd)}
.go:disabled{background:var(--line);box-shadow:0 6px 0 #cfc5b0;color:var(--mut);cursor:default}
.card{margin-top:20px;padding:30px 18px;border-radius:20px;background:var(--card);border:2px solid var(--line);text-align:center}
.card b{font-size:36px;display:block}
.card span{color:var(--mut);font-weight:700;font-size:19px}
.row{display:flex;align-items:center;gap:14px;padding:12px 14px;margin-bottom:10px;border:2px solid var(--line);border-radius:16px;background:var(--card)}
.row small{color:var(--mut);font-weight:700;display:block}
.intro{color:var(--mut);font-weight:700;margin:14px 0 4px}
.big{font-size:64px}
h2.res{font-size:28px;font-weight:900;margin:8px 0}
input#search{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--tx);margin:12px 0}
.chat{display:flex;flex-direction:column;gap:10px;margin:12px 0;min-height:220px}
.bub{max-width:85%;padding:12px 14px;border-radius:16px;font-weight:700;line-height:1.4;white-space:pre-wrap}
.bub.user{align-self:flex-end;background:var(--g);color:#fff}
.bub.assistant{align-self:flex-start;background:var(--card);border:2px solid var(--line)}
.cbar{display:flex;gap:10px;align-items:center;position:sticky;bottom:0;background:var(--bg);padding:10px 0 14px}
.cbar .txt{flex:1;margin:0}
</style>
</head>

function gcd(a,b){ return b?gcd(b,a%b):a; }
function pairsOf(lang,n){
  const u=Math.floor(n/10), j=n%10, U=UNITW[lang][u];
  if(U) return [0,1,2,3,4].map(k=>U[(j*5+k)%U.length]);
  const P=BANKS[lang].p, L=P.length, base=(n*5+Math.floor(n/12))%L;
  const step=[17,19,23,29,31,37,41,43,47].find(s=>gcd(s,L)===1)||1;
  return [0,1,2,3,4].map(k=>P[(base+k*step)%L]);
}
// Palavras aprendidas = palavras das lições concluídas
function learned(lang){ const seen=new Set(), out=[]; S.done[lang].forEach(n=>pairsOf(lang,n).forEach(p=>{ if(!seen.has(p[0])){ seen.add(p[0]); out.push(p); } })); return out; }
function opts(pool,f,ans){ return shuffle([ans,...shuffle(pool.map(x=>x[f]).filter(x=>x!==ans)).slice(0,3)]); }
function makeItems(list,pool,lang){
  const nm=BANKS[lang].name.toLowerCase();
  return list.map(([t,pt],k)=>{
    const m=k%4;
    if(m===0) return {mode:"mc", q:`Como se diz "${pt}" em ${nm}?`, opts:opts(pool,0,t), ans:t};
    if(m===1) return {mode:"mc", q:`O que significa "${t}"?`, opts:opts(pool,1,pt), ans:pt, spk:t};
    if(m===3) return {mode:"mc", q:"Ouça e escolha a palavra:", opts:opts(pool,0,t), ans:t, spk:t};
    if(m===2) return {mode:"type", q:`Escreva em ${nm}: "${pt}"`, ans:t};
  });
}

  if(Array.isArray(w)) return `<div class="card"><b>${w[0]}</b><span>${w[1]}</span><div style="margin-top:18px"><button class="spk" aria-label="Ouvir" onclick="say('${w[0]}','${b.voice}')">🔊</button></div></div>`;
  if(w.k==="note") return `<div class="card"><small style="color:var(--blue);font-weight:900;font-size:16px">Gramática</small><b style="font-size:26px;margin-top:8px">${w.t}</b><span>${w.x}</span></div>`;
  return `<div class="card" style="text-align:left"><small style="color:var(--blue);font-weight:900;font-size:16px">Diálogo</small>${w.lines.map(([tg,pt])=>`<div style="display:flex;gap:10px;align-items:center;margin:12px 0"><button class="spk" aria-label="Ouvir" style="width:38px;height:38px;font-size:16px;flex:none" onclick="say('${tg}','${b.voice}')">🔊</button><div><b style="font-size:19px;display:block">${tg}</b><span>${pt}</span></div></div>`).join("")}</div>`;
}
function nextLesson(){ const C=CUR; if(!C||C.kind!=="lesson"||C.n>=499) return quit(); start(C.n+1); }
function lessonSlides(lang,n,W){ return [{k:"note", ...NOTES[lang][n%6]}, ...W, {k:"dialog", lines:DIALOGS[lang][n%6]}]; }
function start(n){ refillHearts(); if(S.hearts<=0){ CUR={kind:"lesson", n, lang:S.lang, out:true}; render(); return; }
  const lang=S.lang, W=pairsOf(lang,n), rev=reviewPairs(lang,n,W), all=W.concat(rev);
  CUR={kind:"lesson", n, lang, slides:lessonSlides(lang,n,W), si:0, phase:"slides", q:makeItems(all,all,lang).concat(orderItems(lang,n), speakItems(lang,n)), i:0, ok:0, lost:0, sel:null, fb:null, order:[]};
  render();
}
function startDictPractice(){ refillHearts(); if(S.hearts<=0){ CUR={kind:"dict", out:true, lang:S.lang}; render(); return; }
  const L=dictList(); if(!L.length) return;
  const list=shuffle(L.slice()).slice(0,8);
  CUR={kind:"dict", n:null, lang:S.lang, slides:[], si:0, phase:"practice", q:makeItems(list,L,S.lang), i:0, ok:0, lost:0, sel:null, fb:null};
  render();
}
function nextSlide(){ const C=CUR; C.si++; if(C.si>=C.slides.length) C.phase="practice"; render(); }
function pick(i){ if(CUR && !CUR.fb){ CUR.sel=i; render(); } }

function act(){
  const C=CUR;
  if(C.fb){
    C.fb=null; C.sel=null; C.order=[]; C.spoken=null; C.micErr=false; C.i++;
    if(S.hearts<=0){ finish(); return; }
    if(C.i>=C.q.length){ finish(); return; }
    save(); render(); return;
  }
  const ex=C.q[C.i]; let v;
  if(ex.mode==="order"){ if(!(C.order||[]).length) return; v=C.order.map(i=>ex.words[i]).join(" "); }
  else if(ex.mode==="mc"){ if(C.sel===null) return; v=ex.opts[C.sel]; }
  else if(ex.mode==="speak"){ v=C.micUnavailable?ex.ans:C.spoken; if(!v) return; }
  else { v=document.getElementById("ans").value; if(!v.trim()) return; }
  const ok=norm(v)===norm(ex.ans);
  C.fb=ok?"ok":"bad";
  if(ok){ C.ok++; S.xp+=10; say(ex.spk||ex.ans, BANKS[C.lang].voice); if(ex.mode!=="order" && S.weak && S.weak[C.lang]) S.weak[C.lang]=S.weak[C.lang].filter(t=>t!==(ex.spk||ex.ans)); }
  else { C.lost++; loseHeart(); if(ex.mode!=="order"){ S.weak=S.weak||{en:[],es:[]}; const tg=ex.spk||ex.ans; S.weak[C.lang]=S.weak[C.lang]||[]; if(!S.weak[C.lang].includes(tg)) S.weak[C.lang].push(tg); } if(!ex.retry) C.q.push({...ex, retry:true}); }
  save(); render();
}

function finish(){
  const C=CUR;
  if(C.kind==="lesson"){ const d=S.done[C.lang]; if(!d.includes(C.n)) d.push(C.n); }
  S.xp+=20; { const td=today(); S.dayCount=S.dayCount||{}; S.dayCount[td]=(S.dayCount[td]||0)+1; }
  const t=today(), y=dayStr(1);
  if(S.last!==t){ S.streak = S.last===y ? S.streak+1 : 1; S.last=t; }
  C.end=true; save(); render();
}

function path(){
  const lang=S.lang, done=S.done[lang]; let h=calHTML()+(S.goal?goalHTML():"")+continueHTML();
  for(let u=0;u<50;u++){
    const c=done.filter(x=>x>=u*10 && x<u*10+10).length;
    h+=`<section class="unit"><h2>Unidade ${u+1} · ${THEMES[u]}</h2><p>${c}/10 lições</p></section><div class="path">`;
    for(let j=0;j<10;j++){
      const n=u*10+j, open=(n===0||done.includes(n-1)||n<=done.length), d=done.includes(n), off=Math.round(Math.sin(j*1.4)*64);
      h+=`<button class="node ${d?"done":open?"":"lock"}" style="transform:translateX(${off}px)" aria-label="Lição ${n+1}" ${open?`onclick="start(${n})"`:`onclick="lockMsg()"`}>${d?"✓":n+1}</button>`;
    }
    h+="</div>";
  }
  return h;
}

function slidesView(){
  const C=CUR, b=BANKS[C.lang], w=C.slides[C.si], pct=Math.round(C.si/C.slides.length*100);
  return `<div id="lesson"><div class="top"><button class="x" aria-label="Sair" onclick="quit()">✕</button><div class="bar"><i style="width:${pct}%"></i></div></div>
  <p class="intro">Aprenda · ${C.si+1} de ${C.slides.length}</p>
  ${slideCard(w,b)}
  <div class="foot"><button class="go" onclick="nextSlide()">${C.si+1<C.slides.length?"Próximo":"Praticar"}</button></div></div>`;
}

function practiceView(){
  const C=CUR, ex=C.q[C.i], b=BANKS[C.lang], pct=Math.round(C.i/C.q.length*100);
  const body = ex.mode==="order" ? orderBody(ex,C) : ex.mode==="speak" ? speakBody(ex,C) : ex.mode==="mc"
    ? `<div class="q">${ex.q}${ex.spk?`<button class="spk" aria-label="Ouvir" onclick="say('${ex.spk}','${b.voice}')">🔊</button>`:""}</div>
       <div class="opts">${ex.opts.map((o,i)=>`<button class="opt${C.sel===i?" sel":""}" ${C.fb?"disabled":""} onclick="pick(${i})">${esc(o)}</button>`).join("")}</div>`
    : `<div class="q">${ex.q}</div><input class="txt" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Digite aqui" ${C.fb?"disabled":""} onkeydown="if(event.key==='Enter')act()">`;
  const fb = C.fb==="ok" ? `<div class="fb" style="color:var(--okt)">Correto! 🎉</div>`
           : C.fb==="bad" ? `<div class="fb" style="color:var(--badt)">Resposta certa: ${ex.ans}</div>` : "";
  const dis = !C.fb && ((ex.mode==="mc" && C.sel===null) || (ex.mode==="order" && !(C.order||[]).length) || (ex.mode==="speak" && !C.spoken && !C.micUnavailable)) ? "disabled" : "";
  return `<div id="lesson"><div class="top"><button class="x" aria-label="Sair" onclick="quit()">✕</button><div class="bar"><i style="width:${pct}%"></i></div></div>
    ${body}
    <div class="foot ${C.fb==="ok"?"ok":C.fb==="bad"?"bad":""}"><div style="font-weight:900;margin-bottom:8px">❤️ ${ME&&ME.role==="admin"?"∞":S.hearts}</div>${fb}<button class="go" ${dis} onclick="act()">${C.fb?"Continuar":"Verificar"}</button></div></div>`;
}

function endView(){
  const C=CUR, t=C.ok+C.lost, acc=t?Math.round(C.ok/t*100):0;
  return `<div id="lesson" class="center"><div class="big">🏆</div><h2 class="res">${C.kind==="lesson"?"Lição concluída!":"Prática concluída!"}</h2>
    <p style="color:var(--mut);font-weight:700">Acertos: ${C.ok}/${t} (${acc}%)</p>${S.hearts<=0?'<p style="color:var(--badt);font-weight:800">Sem corações por hoje. A próxima lição abre quando você voltar amanhã.</p>':""}
    <p style="font-weight:900;color:#d89a00">+${C.ok*10+20} XP</p>
    <button class="go" style="margin-top:24px" onclick="quit()">Continuar</button>${C.kind==="lesson"?`<button class="tab" style="display:block;width:100%;max-width:520px;margin:12px auto 0;text-align:center" onclick="nextLesson()">Próxima lição</button>`:""}</div>`;
}

const CAT_NAMES=[["tudo","Tudo"],["frases","Frases"],["substantivo","Substantivo"],["pronome","Pronome"],["adjetivo","Adjetivo"],["verbo","Verbo"],["adverbio","Advérbio"]];
const CATS={
 en:{frases:["hello","goodbye","please","thank you","yes","no"],pronome:["I","you","we","they"],verbo:["to eat","to drink","to read","to write","to go","to see"],adjetivo:["big","small","good","bad","happy","sad","hot","cold","red","blue","green","white","black","one","two","three","four","five","old","new","fast","slow","easy","hard"],adverbio:["today","tomorrow","yesterday","always","never","here","there","very","now"]},
 es:{frases:["hola","adiós","gracias","sí","no","buenos días","buenas noches"],pronome:["yo","tú","nosotros","ellos"],verbo:["leer","escribir","hablar","trabajar","estudiar","necesitar","querer","buscar"],adjetivo:["rojo","blanco","negro","uno","dos","tres","cuatro","diez","pequeño","bueno","malo","contento","caliente","frío","viejo","nuevo","lento"],adverbio:["hoy","mañana","ayer","siempre","aquí","allí","muy","ahora"]}
};
let DCAT="tudo";
function catOf(lang,t){ const C=CATS[lang]; for(const k in C) if(C[k].includes(t)) return k; return "substantivo"; }
function dictList(){ const L=learned(S.lang); return DCAT==="tudo"?L:L.filter(p=>catOf(S.lang,p[0])===DCAT); }
function catChips(){ return `<div class="modes" style="margin:12px 0 0;gap:6px">${CAT_NAMES.map(([k,l])=>`<button class="tab ${DCAT===k?"on":""}" style="padding:6px 10px;font-size:14px" onclick="setDcat('${k}')">${l}</button>`).join("")}</div>`; }
function setDcat(c){ DCAT=c; render(); }
function dictView(){
  const L=dictList(), b=BANKS[S.lang];
  const rows=L.map(([t,pt])=>`<div class="row" data-w="${esc(t+" "+pt)}"><button class="spk" aria-label="Ouvir" onclick="say('${t}','${b.voice}')">🔊</button><div><b style="font-size:19px">${t}</b><small>${pt}</small></div></div>`).join("");
  return `<main><p class="intro">${L.length} palavra(s) aprendida(s) em ${b.name.toLowerCase()}.</p>
    <button class="go" ${L.length?"":"disabled"} onclick="startDictPractice()" style="margin-top:10px">Praticar estas palavras</button>
    ${catChips()}<input id="search" placeholder="Buscar palavra" oninput="filterDict(this.value)">
    <div id="dl">${rows||'<p class="intro">Complete uma lição para as palavras aparecerem aqui.</p>'}</div></main>`;
}
function filterDict(v){ const q=norm(v); document.querySelectorAll("#dl .row").forEach(r=>{ r.style.display = norm(r.dataset.w).includes(q) ? "" : "none"; }); }

function storiesView(){
  const L=STORIES[S.lang], d=S.stories[S.lang];
  return L.map((s,i)=>{ const open=i===0||d.includes(i-1), done=d.includes(i);
    return `<button class="unit${open?"":" lock"}" ${open?`onclick="openStory(${i})"`:"disabled"}><h2>${s.t}</h2><p>${done?"✓ Concluída":open?s.l.length+" frases":"Bloqueada"}</p></button>`; }).join("");
}
function openStory(s){ refillHearts(); ST={lang:S.lang, s, i:0, sel:null, fb:null, ok:0, end:false, out:S.hearts<=0}; render(); }
function stPick(i){ if(ST && !ST.fb){ ST.sel=i; render(); } }
function stAct(){
  const L=STORIES[ST.lang][ST.s].l, line=L[ST.i];
  if(ST.fb){
    ST.fb=null; ST.sel=null; ST.i++; if(S.hearts<=0){ ST.out=true; save(); render(); return; }
    if(ST.i>=L.length){ ST.asking=true; }
    save(); render(); return;
  }
  if(ST.sel===null) return;
  const ok=line[2][ST.sel]===line[1];
  ST.fb=ok?"ok":"bad";
  if(ok){ ST.ok++; S.xp+=5; } else { loseHeart(); }
  say(line[0].replace("___",line[1]), BANKS[ST.lang].voice);
  save(); render();
}
function storyView(){
  const b=BANKS[ST.lang];
  if(ST.end) return `<div id="lesson" class="center"><div class="big">📖</div><h2 class="res">História concluída!</h2><p style="font-weight:900;color:#d89a00">+${15+ST.ok*5} XP</p><button class="go" style="margin-top:24px" onclick="ST=null;render()">Continuar</button></div>`;
  const L=STORIES[ST.lang][ST.s].l, line=L[ST.i], pct=Math.round(ST.i/L.length*100), full=line[0].replace("___",line[1]);
  const body = ST.fb
    ? `<div class="q">${full}<button class="spk" aria-label="Ouvir" onclick="say('${full}','${b.voice}')">🔊</button></div><p style="color:var(--mut);font-weight:700">${line[3]}</p>`
    : `<div class="q">${line[0]}</div><div class="opts">${line[2].map((o,i)=>`<button class="opt${ST.sel===i?" sel":""}" ${ST.fb?"disabled":""} onclick="stPick(${i})">${o}</button>`).join("")}</div>`;
  const fb = ST.fb==="ok" ? `<div class="fb" style="color:var(--okt)">Isso mesmo! 🎉</div>` : ST.fb==="bad" ? `<div class="fb" style="color:var(--badt)">Era "${line[1]}"</div>` : "";
  return `<div id="lesson"><div class="top"><button class="x" aria-label="Sair" onclick="ST=null;render()">✕</button><button class="x" aria-label="Ouvir história" onclick="sayStory()">🔊</button><div class="bar"><i style="width:${pct}%"></i></div></div>${body}<div class="foot ${ST.fb==="ok"?"ok":ST.fb==="bad"?"bad":""}">${fb}<button class="go" ${!ST.fb&&ST.sel===null?"disabled":""} onclick="stAct()">${ST.fb?"Continuar":"Verificar"}</button></div></div>`;
}

function chatView(){
  if(CH.lang!==S.lang) CH={lang:S.lang, msgs:[], busy:false};
  const n=BANKS[S.lang].name.toLowerCase();
  const bubs=CH.msgs.map(m=>`<div class="bub ${m.role}">${esc(m.content)}</div>`).join("");
  return `<main><p class="intro">Converse em ${n}. A IA corrige seus erros e ensina palavras novas.</p><div class="chat">${bubs||`<div class="bub assistant">Olá! Escreva algo em ${n} para começar.</div>`}${CH.busy?`<div class="bub assistant">…</div>`:""}</div><div class="cbar"><input id="msg" class="txt" autocomplete="off" placeholder="Escreva em ${n}" ${CH.busy?"disabled":""} onkeydown="if(event.key==='Enter')chatSend()"><button class="go" style="width:auto;padding:14px 18px" ${CH.busy?"disabled":""} onclick="chatSend()">Enviar</button></div></main>`;
}
async function chatSend(){
  const inp=document.getElementById("msg"), t=inp?inp.value.trim():"";
  if(!t||CH.busy) return;
  CH.msgs.push({role:"user", content:t}); CH.busy=true; render();
  const n=BANKS[CH.lang].name.toLowerCase();
  const sys=`Você é um professor de ${n} para um falante de português. Converse em ${n} com frases simples. Depois de cada mensagem do aluno, responda assim: primeiro uma resposta curta em ${n}; depois "Correção:" com o erro corrigido e uma explicação curta em português (ou "Correção: nenhuma"); depois "Palavra nova:" com 1 ou 2 palavras úteis e a tradução. Seja breve.`;
  let reply;
  try{
    const sample = window.claude ? await window.claude.use("sample") : null;
    if(!sample) throw 0;
    const msgs=CH.msgs.map((m,i)=> i===0 ? {role:m.role, content:sys+"\n\nAluno: "+m.content} : m);
    const r=await sample(msgs,{modelTier:"quick", cache:false});
    reply=r.text;
  }catch(e){ reply="Não consegui responder agora. Tente de novo."; }
  CH.msgs.push({role:"assistant", content:reply}); CH.busy=false; render();
}

function shell(){
  const m=S.mode||"path";
  const tabs=Object.entries(BANKS).map(([k,b])=>`<button class="tab ${S.lang===k?"on":""}" onclick="setLang('${k}')">${b.flag} ${b.name}</button>`).join("");
  const modes=[["path","Lições"],["stories","Histórias"],["chat","Conversa com IA"],["dict","Dicionário"],["profile","Perfil"]].map(([k,l])=>`<button class="tab ${m===k?"on":""}" onclick="setMode('${k}')">${l}</button>`).join("");
  return `<header>${logoSVG(34)}${tabs}<div class="stats"><span>🔥 ${S.streak}</span><span>⚡ ${S.xp}</span><span>❤️ ${ME&&ME.role==="admin"?"∞":S.hearts}</span><button onclick="toggleMute()" aria-label="Som" style="font-size:18px">${S.mute?"🔇":"🔊"}</button></div><div class="modes">${modes}</div></header>`;
}

let ME=null, AUTH_READY=false, ADMIN=null, syncT=null;
function defaultState(){ return {xp:0,streak:0,last:"",lang:"en",mode:"path",done:{en:[],es:[]},stories:{en:[],es:[]},hearts:3,heartsDay:"",weak:{en:[],es:[]},dayCount:{}}; }
function syncProgress(){ clearTimeout(syncT); syncT=setTimeout(()=>{ fetch("/api/progress",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({progress:S})}).catch(()=>{}); },800); }
async function loadMe(){
  const r=await fetch("/api/me");
  if(!r.ok){ ME=null; return false; }
  const d=await r.json(); ME=d;
  S=Object.assign(defaultState(), d.progress||{}); S.hearts = d.hearts===null ? 999 : d.hearts;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  return true;
}
async function boot(){ try{ await loadMe(); }catch(e){ ME=null; } AUTH_READY=true; render(); }
async function authSubmit(mode){
  const name=document.getElementById("aName").value.trim(), email=document.getElementById("aEmail").value.trim(), password=document.getElementById("aPass").value;
  const err=document.getElementById("aErr"); err.textContent="";
  try{
    const r=await fetch(mode==="signup"?"/api/signup":"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(mode==="signup"?{name,email,password}:{email,password})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ err.textContent=d.error||"Não foi possível entrar."; return; }
    await loadMe(); render();
  }catch(e){ err.textContent="Sem conexão com o servidor. Tente de novo."; }
}
async function logout(){
  try{ await fetch("/api/logout",{method:"POST"}); }catch(e){}
  try{ localStorage.removeItem(KEY); }catch(e){}
  location.reload();
}
function authView(){
  return `<main style="padding-top:24px"><div style="text-align:center">${logoSVG(96)}</div><h2 class="res" style="text-align:center">Dogglot</h2><p class="intro" style="text-align:center">Entre ou crie sua conta para salvar seu progresso.</p><div class="card" style="text-align:left"><input id="aName" class="txt" placeholder="Nome (só para cadastro)" autocomplete="name"><input id="aEmail" class="txt" type="email" placeholder="E-mail" autocomplete="email"><input id="aPass" class="txt" type="password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="current-password"><p id="aErr" style="color:var(--badt);font-weight:800;min-height:22px;margin:12px 0 0"></p><button class="go" onclick="authSubmit('login')">Entrar</button><button class="go" style="margin-top:10px;background:var(--card);color:var(--tx);box-shadow:0 6px 0 var(--line);border:2px solid var(--line)" onclick="authSubmit('signup')">Criar conta</button></div></main>`;
}
function adminView(){
  if(!ADMIN){
    fetch("/api/admin/users").then(r=>r.json()).then(d=>{ ADMIN=d; render(); }).catch(()=>{ ADMIN={error:"Sem conexão"}; render(); });
    return `<main><p class="intro">Carregando usuários...</p></main>`;
  }
  if(!Array.isArray(ADMIN)) return `<main><p class="intro">${esc(ADMIN.error||"Sem permissão")}</p><button class="go" onclick="setMode('profile')">Voltar</button></main>`;
  return `<main><h2 class="res" style="margin-top:12px">Usuários (${ADMIN.length})</h2><button class="go" style="margin:8px 0 14px" onclick="ADMIN=null;render()">Atualizar</button>${ADMIN.map(u=>`<div class="row" style="flex-direction:column;align-items:flex-start;gap:4px"><b>${esc(u.nome)}</b><small>${esc(u.email)} · ${esc(u.papel)} · corações: ${esc(u.coracoes)}</small><small>Próxima lição: inglês ${u.proxima_licao.ingles} · espanhol ${u.proxima_licao.espanhol}</small></div>`).join("")}</main>`;
}
function loseHeart(){
  if(ME&&ME.role==="admin") return;
  S.hearts=Math.max(0,S.hearts-1);
  if(ME) fetch("/api/hearts/lose",{method:"POST"}).then(r=>r.json()).then(d=>{ if(d&&d.hearts!=null) S.hearts=d.hearts; }).catch(()=>{});
}
boot();
function render(){ refillHearts();
  const app0=document.getElementById("app");
  if(!AUTH_READY){ app0.innerHTML="<main><p class='intro'>Carregando...</p></main>"; return; }
  if(!ME){ app0.innerHTML=authView(); return; }
  const app=document.getElementById("app");
  if(ST){ app.innerHTML=ST.out?outView():ST.asking?quesView():storyView(); return; }
  if(CUR){
    if(CUR.out) app.innerHTML=outView(); else if(CUR.end) app.innerHTML=endView();
    else if(CUR.phase==="slides") app.innerHTML=slidesView();
    else { app.innerHTML=practiceView(); const a=document.getElementById("ans"); if(a) a.focus(); }
    return;
  }
  const m=S.mode||"path";
  const body = (S.goal===undefined||S.lvEs===undefined) ? onboardView() : m==="stories" ? `<main><p class="intro">Complete as frases com a palavra certa.</p>${storiesView()}</main>`
             : m==="chat" ? chatView()
             : m==="admin" ? adminView() : m==="profile" ? profileView() : m==="dict" ? dictView()
             : `<main>${path()}</main>`;
  app.innerHTML = shell() + body;
}
render();
</script>
</body>
